<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-flutter/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CSKN ERP">
  <title>CSKN ERP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; padding: 0; background: #0a0e14; }
    #loading-container { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    #loading-container .logo { font-size: 32px; font-weight: bold; color: #4CAF50; margin-bottom: 16px; }
    #loading-container .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top: 3px solid #4CAF50; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo">CSKN ERP</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter.js"></script>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
