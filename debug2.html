<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-erp-flutter/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSKN Debug 2</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0e14; color: #fff; font-family: monospace; }
    #log { padding: 10px; font-size: 12px; white-space: pre-wrap; max-height: 100vh; overflow-y: auto; }
    .error { color: #ff5252; }
    .info { color: #4CAF50; }
    .warn { color: #ffc107; }
    .detail { color: #82b1ff; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script>
    const logEl = document.getElementById('log');
    function log(msg, type) {
      const div = document.createElement('div');
      div.className = type || 'info';
      div.textContent = new Date().toISOString().substr(11,8) + ' ' + msg;
      logEl.appendChild(div);
    }
    window.onerror = function(msg, url, line, col, err) {
      log('ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col, 'error');
      if (err && err.stack) log('STACK: ' + err.stack, 'error');
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      log('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error');
      if (e.reason && e.reason.stack) log('REJ STACK: ' + e.reason.stack, 'error');
    });
    
    // Also capture console.error
    const origError = console.error;
    console.error = function(...args) {
      log('CONSOLE.ERROR: ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'error');
      origError.apply(console, args);
    };
    const origWarn = console.warn;
    console.warn = function(...args) {
      log('CONSOLE.WARN: ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'warn');
      origWarn.apply(console, args);
    };

    log('Page loaded');
    log('User agent: ' + navigator.userAgent);
    
    // Test WebAssembly.compileStreaming with builtins
    async function testBuiltins() {
      try {
        const response = await fetch('canvaskit/chromium/canvaskit.wasm');
        log('CanvasKit wasm fetch status: ' + response.status, 'detail');
        
        try {
          const builtins = {builtins: ['js-string']};
          const module = await WebAssembly.compileStreaming(response.clone(), builtins);
          log('compileStreaming WITH builtins: SUCCESS (' + module instanceof WebAssembly.Module + ')', 'info');
        } catch(e) {
          log('compileStreaming WITH builtins FAILED: ' + e.message, 'error');
        }
        
        try {
          const module2 = await WebAssembly.compileStreaming(response.clone());
          log('compileStreaming WITHOUT builtins: SUCCESS', 'info');
        } catch(e) {
          log('compileStreaming WITHOUT builtins FAILED: ' + e.message, 'error');
        }
      } catch(e) {
        log('testBuiltins error: ' + e.message, 'error');
      }
    }
    testBuiltins();
  </script>
  <script src="flutter.js"></script>
  <script>
    log('flutter.js loaded, _flutter=' + typeof window._flutter);
  </script>
  <script src="flutter_bootstrap.js"></script>
  <script>
    log('flutter_bootstrap.js executed');
    
    // Check at various intervals
    [3, 5, 8, 12, 18, 25, 35].forEach(sec => {
      setTimeout(function() {
        log('--- Check at ' + sec + 's ---', 'detail');
        log('_flutter=' + typeof window._flutter + ', buildConfig=' + (window._flutter && window._flutter.buildConfig ? 'set' : 'missing'));
        log('flutterCanvasKitLoaded=' + typeof window.flutterCanvasKitLoaded);
        log('flutterCanvasKit=' + typeof window.flutterCanvasKit);
        log('body children: ' + document.body.children.length);
        let fltCount = 0;
        for (let i = 0; i < document.body.children.length; i++) {
          const child = document.body.children[i];
          if (child.tagName.startsWith('FLT') || child.tagName === 'CANVAS') {
            log('  FLUTTER: ' + child.tagName + ' id=' + child.id);
            fltCount++;
          }
        }
        if (fltCount === 0) log('  No Flutter elements found', 'warn');
        // Check for canvases
        const canvases = document.querySelectorAll('canvas');
        if (canvases.length > 0) log('  Found ' + canvases.length + ' canvas elements', 'info');
      }, sec * 1000);
    });
  </script>
</body>
</html>
