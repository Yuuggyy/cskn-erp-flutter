<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-erp-flutter/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSKN Minimal Test</title>
  <style>
    body { margin: 0; background: #0a0e14; }
    #splash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #4CAF50; font-family: monospace; }
  </style>
</head>
<body>
  <div id="splash">Loading minimal...</div>
  <script src="flutter.js"></script>
  <script>
    _flutter.buildConfig = {
      "engineRevision": "5a2a6a42cce67f965cf540fcecf616faca624aa1",
      "builds": [{
        "compileTarget": "dart2wasm",
        "renderer": "canvaskit",
        "mainWasmPath": "main_minimal.dart.wasm",
        "jsSupportRuntimePath": "main_minimal.dart.mjs"
      }]
    };
    _flutter.loader.load({
      config: {
        canvasKitBaseUrl: "canvaskit/",
        useLocalCanvasKit: true
      },
      onEntrypointLoaded: async function(engineInitializer) {
        let appRunner = await engineInitializer.initializeEngine({});
        await appRunner.runApp();
        document.getElementById('splash').remove();
      }
    });
  </script>
</body>
</html>
