<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-erp-flutter/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSKN ERP Debug</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0e14; color: #fff; font-family: monospace; }
    #log { padding: 10px; font-size: 12px; white-space: pre-wrap; }
    .error { color: #ff5252; }
    .info { color: #4CAF50; }
    .warn { color: #ffc107; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script>
    const logEl = document.getElementById('log');
    function log(msg, type) {
      const div = document.createElement('div');
      div.className = type || 'info';
      div.textContent = new Date().toISOString().substr(11,8) + ' ' + msg;
      logEl.appendChild(div);
    }
    window.onerror = function(msg, url, line, col, err) {
      log('ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col, 'error');
      if (err && err.stack) log('STACK: ' + err.stack, 'error');
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      log('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error');
    });
    log('Page loaded');
  </script>
  <script src="flutter.js"></script>
  <script>
    log('flutter.js loaded, _flutter=' + typeof window._flutter);
    if (window._flutter) {
      log('loader=' + typeof window._flutter.loader, 'info');
    }
  </script>
  <script src="flutter_bootstrap.js"></script>
  <script>
    log('flutter_bootstrap.js executed');
    setTimeout(function() {
      log('Checking state after 2s...');
      log('_flutter=' + typeof window._flutter + ', buildConfig=' + (window._flutter && window._flutter.buildConfig ? 'set' : 'missing'));
      log('flutterCanvasKitLoaded=' + typeof window.flutterCanvasKitLoaded);
      log('flutterCanvasKit=' + typeof window.flutterCanvasKit);
      // Check body children
      log('body children: ' + document.body.children.length);
      for (let i = 0; i < document.body.children.length; i++) {
        log('  child[' + i + ']: ' + document.body.children[i].tagName + ' ' + document.body.children[i].id);
      }
    }, 2000);
    setTimeout(function() {
      log('Checking state after 5s...');
      log('body children: ' + document.body.children.length);
      for (let i = 0; i < document.body.children.length; i++) {
        log('  child[' + i + ']: ' + document.body.children[i].tagName + ' ' + document.body.children[i].id);
      }
    }, 5000);
    setTimeout(function() {
      log('Checking state after 10s...');
      log('body children: ' + document.body.children.length);
      for (let i = 0; i < document.body.children.length; i++) {
        log('  child[' + i + ']: ' + document.body.children[i].tagName + ' id=' + document.body.children[i].id + ' class=' + document.body.children[i].className);
      }
    }, 10000);
  </script>
</body>
</html>
