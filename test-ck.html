<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-erp-flutter/">
  <meta charset="UTF-8">
  <title>CanvasKit Test</title>
  <style>
    body { margin: 0; padding: 10px; background: #0a0e14; color: #fff; font-family: monospace; }
    #log { font-size: 13px; white-space: pre-wrap; }
    .error { color: #ff5252; }
    .info { color: #4CAF50; }
    .warn { color: #ffc107; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg, type) {
      const div = document.createElement('div');
      div.className = type || 'info';
      div.textContent = new Date().toISOString().substr(11,8) + ' ' + msg;
      logEl.appendChild(div);
    }

    window.onerror = function(msg, url, line, col, err) {
      log('ERROR: ' + msg + ' at ' + (url||'') + ':' + line, 'error');
      if (err && err.stack) log('STACK: ' + err.stack, 'error');
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      log('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error');
    });

    log('Starting CanvasKit test...');
    log('Chrome version: ' + navigator.userAgent.match(/Chrome\/(\d+)/)?.[1]);

    try {
      log('Importing canvaskit/chromium/canvaskit.js...');
      const ckModule = await import('canvaskit/chromium/canvaskit.js');
      log('Import successful! default=' + typeof ckModule.default, 'info');
      log('Module keys: ' + Object.keys(ckModule).join(', '));
      
      log('Initializing CanvasKit...');
      const ck = await ckModule.default({
        instantiateWasm: async (info, receiveInstance) => {
          log('instantiateWasm called, importing wasm...');
          try {
            const response = await fetch('canvaskit/chromium/canvaskit.wasm');
            log('Wasm fetch status: ' + response.status);
            const bytes = await response.arrayBuffer();
            log('Wasm bytes: ' + bytes.byteLength);
            const module = await WebAssembly.instantiate(bytes, info);
            log('Wasm instantiated!', 'info');
            receiveInstance(module.instance);
          } catch(e) {
            log('instantiateWasm error: ' + e.message, 'error');
          }
        }
      });
      log('CanvasKit initialized! type=' + typeof ck, 'info');
      log('CanvasKit.MakeCanvas=' + typeof ck.MakeCanvas, 'info');
    } catch(e) {
      log('CanvasKit test failed: ' + e.message, 'error');
      if (e.stack) log('STACK: ' + e.stack, 'error');
    }
  </script>
</body>
</html>
