<!DOCTYPE html>
<html>
<head>
  <base href="/cskn-erp-flutter/">
  <meta charset="UTF-8">
  <title>CK Test 3</title>
  <style>
    body { margin: 0; padding: 10px; background: #0a0e14; color: #fff; font-family: monospace; font-size: 13px; }
    .error { color: #ff5252; }
    .info { color: #4CAF50; }
    .warn { color: #ffc107; }
  </style>
</head>
<body>
  <div id="log"></div>
  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg, type) {
      const div = document.createElement('div');
      div.className = type || 'info';
      div.textContent = new Date().toISOString().substr(11,8) + ' ' + msg;
      logEl.appendChild(div);
    }
    window.addEventListener('unhandledrejection', e => {
      log('REJECTION: ' + e.reason, 'error');
    });
    window.onerror = (msg, url, line, col, err) => {
      log('ERROR: ' + msg + ' at line ' + line, 'error');
      if (err && err.stack) log(err.stack, 'error');
      return false;
    };

    log('Base URI: ' + document.baseURI);
    
    // Use absolute URL like flutter.js does
    const baseUrl = new URL('canvaskit/chromium/', document.baseURI).toString();
    log('CanvasKit base URL: ' + baseUrl);
    
    const ckJsUrl = new URL('canvaskit.js', baseUrl + '/').toString();
    const ckWasmUrl = new URL('canvaskit.wasm', baseUrl + '/').toString();
    log('CK JS URL: ' + ckJsUrl);
    log('CK WASM URL: ' + ckWasmUrl);

    try {
      log('Importing canvaskit.js...');
      const mod = await import(baseUrl + 'canvaskit.js');
      log('Import OK! default=' + typeof mod.default, 'info');
      
      log('Fetching wasm...');
      const resp = await fetch(baseUrl + 'canvaskit.wasm');
      log('Wasm fetch: ' + resp.status + ' size=' + resp.headers.get('content-length'));
      
      log('Compiling wasm...');
      const wasmModule = await WebAssembly.compileStreaming(resp.clone());
      log('Wasm compiled!', 'info');
      
      log('Instantiating CanvasKit...');
      const ck = await mod.default({
        instantiateWasm: (info, receiveInstance) => {
          log('instantiateWasm callback called');
          WebAssembly.instantiate(wasmModule, info).then(instance => {
            log('Instance created, calling receiveInstance...', 'info');
            receiveInstance(instance);
          });
        }
      });
      log('CanvasKit ready! type=' + typeof ck + ' MakeCanvas=' + typeof ck.MakeCanvas, 'info');
    } catch(e) {
      log('FAILED: ' + e.message, 'error');
      if (e.stack) log(e.stack, 'error');
    }
  </script>
</body>
</html>
